# 真机站点配置：默认只观察/影子计算，不输出运动。
# 数组按J1..J6填写，不复制厂家PDO的[J2,J1,...]顺序。
bridge:
  joint_names: [elfin_joint1, elfin_joint2, elfin_joint3, elfin_joint4, elfin_joint5, elfin_joint6]
  # 只有现场核验了限值、反馈/总线失效处理、JTC插值及停止保持后才可设为true。
  site_review_complete: false
  joint_states_topic: /joint_states
  controller_state_topic: /elfin_arm_controller/state
  enable_state_topic: /elfin_ros_control/elfin/enable_state
  fault_state_topic: /elfin_ros_control/elfin/fault_state
  controller_name: elfin_arm_controller
  controller_type: position_controllers/JointTrajectoryController
  list_controllers_service: /controller_manager/list_controllers
  candidate_topic: /elfin5_real/candidate_trajectory
  command_topic: /elfin_arm_controller/command
  # 站点提供std_srvs/Trigger：停止当前运动并保持；不是空回执或disable_robot别名。
  stop_service: /elfin5_site/stop_hold
  position_lower: []
  position_upper: []
  velocity_limits: []
  acceleration_limits: []
  max_endpoint_step: []
  # 示例时间参数均待实测，不能当成已验证的实时/安全指标。
  input_timeout: 0.3
  max_input_skew: 0.08
  candidate_max_age: 0.02
  candidate_timeout: 0.15
  min_horizon: 0.02
  max_horizon: 0.15
  hold_horizon: 0.10

# 监视器只读计算FK/误差和显示，不参与网关放行。
monitor:
  joint_names: [elfin_joint1, elfin_joint2, elfin_joint3, elfin_joint4, elfin_joint5, elfin_joint6]
  world_frame: absolute_world
  model_root_frame: world
  base_link: elfin_base_link
  tip_link: elfin_end_link
  base_tf_mode: pose
  base_tf_position_tolerance: 0.001
  base_tf_angle_tolerance: 0.001
  joint_states_topic: /joint_states
  base_pose_topic: /base_pose
  target_point_topic: /target_point
  controller_state_topic: /elfin_arm_controller/state
  input_timeout: 0.3
  max_input_skew: 0.08
  path_max_points: 2000

# QP只生成候选，不直接控制真实JTC。姿态不作为主动控制目标。
qp_candidate:
  absolute_frame: absolute_world
  maximum_cartesian_speed: 0.01
  velocity_limit_scale: 0.05
  # 基础加速度改为1 rad/s²；候选采用0.25 rad/s²，接近原0.2512初值。
  # 这不是厂家额定值或已验证的真机安全加速度，网关仍默认关闭。
  acceleration_limit_scale: 0.25
  input_timeout: 0.3
